name: DeepseekUsageTracker
options:
  bundleIdPrefix: com.deepseekusage
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
targets:
  DeepseekUsageTracker:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: DeepSeek Usage
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 okric (https://github.com/okric)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepseekusage.tracker
        PRODUCT_NAME: DeepseekUsageTracker
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  DeepseekUsageTrackerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DeepseekUsageTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepseekusage.tracker.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DeepseekUsageTracker.app/Contents/MacOS/DeepseekUsageTracker"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DeepseekUsageTracker:
    build:
      targets:
        DeepseekUsageTracker: all
        DeepseekUsageTrackerTests: [test]
    test:
      config: Debug
      targets:
        - DeepseekUsageTrackerTests
    run:
      config: Debug
